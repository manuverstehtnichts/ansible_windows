image: ghcr.io/ansible-community/community-ee-minimal:latest

stages:
  - deploy

deploy_ansible:
  stage: deploy
  tags: [homelab]
  # Nur manuell: zielt auf einen Windows-Client (192.168.1.138), nicht auf das Homelab.
  # Benötigt die CI-Variable ANSIBLE_SSH_KEY (fehlt aktuell) + ANSIBLE_VAULT_PASSWORD.
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$ANSIBLE_SSH_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -H 192.168.1.138 >> ~/.ssh/known_hosts
  script:
    - ansible-galaxy collection install -r requirements.yml
    - echo "$ANSIBLE_VAULT_PASSWORD" > .vault_pass
    - ansible-playbook main.yml -i inventory --vault-password-file .vault_pass